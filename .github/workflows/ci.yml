name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install Chromium for browser end-to-end tests
        run: python -m playwright install --with-deps chromium

      - name: Run unit, integration, and end-to-end tests
        run: python -m pytest tests -v --cov=crm_cloud_demo --cov-report=term-missing --cov-fail-under=100

      - name: Check code style
        run: python -m ruff check src tests
