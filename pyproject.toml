[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "automacao-crm-excel-cloud"
version = "0.1.0"
description = "Bilingual PT-BR/English demo of web automation between a CRM and a document library"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "playwright",
    "openpyxl",
    "jinja2",
    "python-multipart",
    "python-dotenv",
    "defusedxml",
    "itsdangerous",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["crm_cloud_demo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
