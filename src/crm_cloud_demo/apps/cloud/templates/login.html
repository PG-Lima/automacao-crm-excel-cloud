<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Biblioteca Demo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #101827;
            color: #f8fafc;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 38px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
        }

        .icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            border-radius: 12px;
            background: #2563eb;
            font-size: 24px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 25px;
        }

        .subtitle {
            margin: 0 0 28px;
            color: #94a3b8;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #475569;
            border-radius: 8px;
            background: #0f172a;
            color: white;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #3b82f6;
            border-color: transparent;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 8px;
            background: #7f1d1d;
            color: #fecaca;
            font-size: 14px;
        }

        .demo-label {
            margin-top: 24px;
            color: #64748b;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <div class="icon">☁</div>

        <h1>Biblioteca de documentos</h1>

        <p class="subtitle">
            Acesse o ambiente demonstrativo para armazenar
            e consultar relatórios.
        </p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <label for="username">Usuário</label>
            <input
                type="text"
                id="username"
                name="username"
                autocomplete="username"
                required
            >

            <label for="password">Senha</label>
            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Entrar na biblioteca</button>
        </form>

        <p class="demo-label">
            AMBIENTE FICTÍCIO · PROJETO DEMONSTRATIVO
        </p>
    </main>
</body>
</html>
