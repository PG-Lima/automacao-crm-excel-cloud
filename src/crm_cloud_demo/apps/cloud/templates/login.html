<!DOCTYPE html>
<html lang="{{ t.html_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t.cloud_login_title }}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #101827;
            color: #f8fafc;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 38px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
        }

        .icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            border-radius: 12px;
            background: #2563eb;
            font-size: 24px;
        }


        .language-switch {
            position: fixed;
            top: 20px;
            right: 24px;
            display: flex;
            gap: 6px;
            z-index: 10;
        }

        .language-switch a {
            padding: 7px 10px;
            border: 1px solid rgba(148, 163, 184, .35);
            border-radius: 7px;
            color: #cbd5e1;
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .3px;
        }

        .language-switch a.active {
            border-color: #60a5fa;
            background: rgba(37, 99, 235, .2);
            color: #bfdbfe;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 25px;
        }

        .subtitle {
            margin: 0 0 28px;
            color: #94a3b8;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #475569;
            border-radius: 8px;
            background: #0f172a;
            color: white;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #3b82f6;
            border-color: transparent;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 8px;
            background: #7f1d1d;
            color: #fecaca;
            font-size: 14px;
        }

        .demo-label {
            margin-top: 24px;
            color: #64748b;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>

<body>
    <nav class="language-switch" aria-label="Language">
        <a href="/language/pt?next_path=/login" class="{{ 'active' if lang == 'pt' else '' }}">PT-BR</a>
        <a href="/language/en?next_path=/login" class="{{ 'active' if lang == 'en' else '' }}">EN</a>
    </nav>
    <main class="login-card">
        <div class="icon">☁</div>

        <h1>{{ t.document_library }}</h1>

        <p class="subtitle">
            {{ t.cloud_login_description }}
        </p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <label for="username">{{ t.username }}</label>
            <input
                type="text"
                id="username"
                name="username"
                autocomplete="username"
                required
            >

            <label for="password">{{ t.password }}</label>
            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
            >

            <button type="submit">{{ t.cloud_login_button }}</button>
        </form>

        <p class="demo-label">
            {{ t.fictional_demo }}
        </p>
    </main>
</body>
</html>
